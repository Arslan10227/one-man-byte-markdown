name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows ─────────────────────────────────────────────────
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact-name: windows-x86_64

          # ── macOS universal (arm64 + x86_64) ───────────────────────
          - platform: macos-latest
            target: universal-apple-darwin
            artifact-name: macos-universal

          # ── Linux ───────────────────────────────────────────────────
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact-name: linux-x86_64

    runs-on: ${{ matrix.platform }}
    name: Build — ${{ matrix.artifact-name }}

    steps:
      # ── Checkout ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node.js ─────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── Rust ────────────────────────────────────────────────────────
      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # ── Linux system dependencies ────────────────────────────────────
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      # ── macOS — add both Rust targets for universal binary ───────────
      - name: Add macOS Rust targets for universal binary
        if: matrix.platform == 'macos-latest'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      # ── Frontend deps ─────────────────────────────────────────────────
      - name: Install frontend dependencies
        run: npm ci

      # ── Build with tauri-action ───────────────────────────────────────
      - name: Build and bundle Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing (optional — skipped if secrets not set)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          releaseName: 'OneManByte Markdown ${{ github.event_name == ''workflow_dispatch'' && github.event.inputs.version || github.ref_name }}'
          releaseBody: |
            ## OneManByte — Markdown

            A lightning-fast, cross-platform Markdown editor built with Tauri v2, Svelte 5, and CodeMirror 6.

            ### Downloads
            | Platform | File |
            |---|---|
            | Windows | `OneManByte-Markdown_*_x64-setup.exe` or `.msi` |
            | macOS (Universal) | `OneManByte-Markdown_*_universal.dmg` |
            | Linux | `OneManByte-Markdown_*_amd64.AppImage` or `.deb` |

            ### Changelog
            See [commit history](https://github.com/${{ github.repository }}/commits) for full details.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
