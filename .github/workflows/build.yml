name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows ────────────────────────────────────────────────────────
          - platform: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            tauri-args: ''
            artifact-name: windows-x86_64

          # ── macOS Universal (arm64 + x86_64) ───────────────────────────────
          # NOTE: universal-apple-darwin is a Tauri synthetic target, NOT a real
          # Rust target. We install both real targets; tauri-action handles lipo.
          - platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: '--target universal-apple-darwin'
            artifact-name: macos-universal

          # ── Linux ──────────────────────────────────────────────────────────
          # ubuntu-24.04 ships webkit2gtk-4.1 natively (22.04 has broken deps)
          - platform: ubuntu-24.04
            rust-targets: x86_64-unknown-linux-gnu
            tauri-args: ''
            artifact-name: linux-x86_64

    runs-on: ${{ matrix.platform }}
    name: Build — ${{ matrix.artifact-name }}

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node.js ─────────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── Rust ────────────────────────────────────────────────────────────────
      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # ── Linux system dependencies ────────────────────────────────────────────
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      # ── Frontend dependencies ────────────────────────────────────────────────
      - name: Install frontend dependencies
        run: npm ci

      # ── Build and publish via tauri-action ──────────────────────────────────
      - name: Build and bundle Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          releaseName: 'OneManByte Markdown ${{ github.event_name == ''workflow_dispatch'' && github.event.inputs.version || github.ref_name }}'
          releaseBody: |
            ## OneManByte — Markdown ⚡

            A lightning-fast, cross-platform Markdown editor.

            ### Downloads
            | Platform | Installer |
            |---|---|
            | 🪟 Windows | `*_x64-setup.exe` (NSIS) or `*_x64_en-US.msi` |
            | 🍎 macOS Universal | `*_universal.dmg` |
            | 🐧 Linux | `*_amd64.AppImage` or `*_amd64.deb` |

            > First install on macOS: right-click → Open if Gatekeeper blocks it.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.tauri-args }}
