<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base with Glow -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="6" filter="url(#shadow)"/>
  
  <!-- Subtle inner grid pattern accent -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1.5">
    <line x1="80" y1="20" x2="80" y2="492"/>
    <line x1="160" y1="20" x2="160" y2="492"/>
    <line x1="240" y1="20" x2="240" y2="492"/>
    <line x1="320" y1="20" x2="320" y2="492"/>
    <line x1="400" y1="20" x2="400" y2="492"/>
    <line x1="20" y1="80" x2="492" y2="80"/>
    <line x1="20" y1="160" x2="492" y2="160"/>
    <line x1="20" y1="240" x2="492" y2="240"/>
    <line x1="20" y1="320" x2="492" y2="320"/>
    <line x1="20" y1="400" x2="492" y2="400"/>
  </g>

  <!-- Markdown Icon "M" -->
  <path d="M 96 352 L 96 160 L 168 244 L 240 160 L 240 352" 
        fill="none" 
        stroke="url(#mGrad)" 
        stroke-width="36" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#shadow)"/>

  <!-- Markdown Down Arrow Section -->
  <!-- Outer Glow Circle -->
  <circle cx="368" cy="256" r="80" fill="url(#arrowGrad)" filter="url(#glow)"/>
  
  <!-- Inner Contrast Circle Ring -->
  <circle cx="368" cy="256" r="74" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Arrow Shaft and Head -->
  <path d="M 368 200 L 368 296" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
  <path d="M 328 266 L 368 312 L 408 266" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
